<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="primary-btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="critical-btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0.35)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.0)" />
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="shadow-nav" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg-grad)" />
  
    <g id="StatusBar" opacity="0.9">
      <text x="32" y="34" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700">09:41</text>
      <!-- Dynamic Island / Speaker -->
      <rect x="145" y="11" width="100" height="24" rx="12" fill="#000000" stroke="#1E293B" stroke-width="0.5" />
      <circle x="228" y="23" r="5" fill="#0F172A" />
      <circle x="162" y="23" r="4" fill="#0A0F1D" />
      <!-- Icons Right: Signal, Wifi, Battery -->
      <g transform="translate(322, 22)" fill="#F8FAFC">
        <!-- Signal -->
        <rect x="0" y="7" width="2.5" height="4" rx="0.5" />
        <rect x="4" y="5" width="2.5" height="6" rx="0.5" />
        <rect x="8" y="3" width="2.5" height="8" rx="0.5" />
        <rect x="12" y="0" width="2.5" height="11" rx="0.5" />
        <!-- Wifi -->
        <path d="M 20 8 A 4 4 0 0 1 24 8 M 18.5 5.5 A 7 7 0 0 1 25.5 5.5 M 17 3 A 10 10 0 0 1 27 3" fill="none" stroke="#F8FAFC" stroke-width="1.3" stroke-linecap="round" />
        <!-- Battery -->
        <rect x="30" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
        <rect x="32" y="3" width="14" height="6" rx="1.5" fill="#10B981" />
        <path d="M 51 4 Q 52 4 52 5 L 52 7 Q 52 8 51 8 Z" fill="#F8FAFC" />
      </g>
    </g>
  
  
    <g id="AppHeader">
      <!-- Top separator border -->
      <line x1="16" y1="102" x2="374" y2="102" stroke="#1E293B" stroke-width="1" />
      
      <!-- Avatar with initials -->
      <rect x="16" y="54" width="40" height="40" rx="12" fill="#2563EB" />
      <text x="36" y="79" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">AQ</text>
      
      <!-- Company Eyebrow & Username -->
      <text x="64" y="66" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PT GALAXY MANDIRI PERKASA</text>
      <text x="64" y="84" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">Administrator QC GMP</text>
      
      <!-- Role Badge Pill -->
      <rect x="238" y="72" width="46" height="17" rx="5" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="0.8" />
      <text x="261" y="84" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Admin</text>
      
      <!-- Online Status Pill -->
      <rect x="296" y="64" width="56" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <circle x="306" y="75" r="3.5" fill="#10B981" />
      <text x="331" y="79" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.4">ONLINE</text>
      
      <!-- Theme Moon Toggle Button -->
      <rect x="358" y="62" width="26" height="26" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <path d="M 373 70 A 5 5 0 1 1 367 76 A 4.5 4.5 0 0 0 373 70 Z" fill="#F59E0B" />
    </g>
  

  <!-- Dual History Switcher ([Produksi] vs [Cacat NG]) -->
  <g id="DualHistorySwitcher" transform="translate(16, 114)">
    <rect x="0" y="0" width="358" height="40" rx="12" fill="#111827" stroke="#334155" stroke-width="1.2" />
    <!-- Produksi Button (Active) -->
    <rect x="3" y="3" width="174" height="34" rx="9" fill="#2563EB" />
    <text x="90" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">Produksi</text>
    <!-- Cacat NG Button -->
    <text x="268" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Cacat NG</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="16" y="174" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" letter-spacing="0.4">RIWAYAT PRODUKSI</text>
  <text x="16" y="190" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500">Rekap hasil cetak mesin, target, dan produk bagus bersih</text>

  <!-- Filter Period Tabs: Hari Ini | 7 Hari | Semua -->
  <g id="FilterPeriod" transform="translate(16, 202)">
    <rect x="0" y="0" width="358" height="34" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="57" y="21" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Hari Ini</text>
    <text x="179" y="21" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">7 Hari</text>
    <!-- Tab 3: Semua (Active) -->
    <rect x="240" y="2.5" width="115" height="29" rx="7" fill="#2563EB" />
    <text x="297" y="21" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Semua</text>
  </g>

  <!-- Search Box -->
  <g id="SearchBox" transform="translate(16, 244)">
    <rect x="0" y="0" width="358" height="36" rx="9" fill="#111827" stroke="#334155" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="none" stroke="#64748B" stroke-width="1.5" />
    <line x1="24" y1="22" x2="28" y2="26" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" />
    <text x="38" y="22" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="500">Cari mesin, part, proses, shift...</text>
  </g>

  <!-- Summary KPI Bar (1 Unified Row) -->
  <g id="SummaryBar" transform="translate(16, 288)">
    <rect x="0" y="0" width="358" height="48" rx="12" fill="#111827" stroke="#334155" stroke-width="1" />
    <!-- Col 1: Gross -->
    <text x="44" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Gross</text>
    <text x="44" y="34" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">112.022</text>
    <line x1="89" y1="8" x2="89" y2="40" stroke="#1E293B" stroke-width="1" />
    <!-- Col 2: NG -->
    <text x="134" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">NG</text>
    <text x="134" y="34" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">1.364</text>
    <line x1="179" y1="8" x2="179" y2="40" stroke="#1E293B" stroke-width="1" />
    <!-- Col 3: Net OK -->
    <text x="224" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Net OK</text>
    <text x="224" y="34" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">110.658</text>
    <line x1="268" y1="8" x2="268" y2="40" stroke="#1E293B" stroke-width="1" />
    <!-- Col 4: Efisiensi -->
    <text x="313" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Efisiensi</text>
    <text x="313" y="34" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">98.8%</text>
  </g>

  <!-- Production History Card 1 -->
  <g id="ProductionCard_1" transform="translate(16, 344)">
    <rect x="0" y="0" width="358" height="194" rx="16" fill="#111827" stroke="#334155" stroke-width="1" filter="url(#shadow-card)" />

    <!-- Card Header -->
    <text x="16" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Amada 1</text>
    <!-- Stamping badge -->
