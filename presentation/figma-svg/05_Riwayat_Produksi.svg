      <rect x="0" y="0" width="330" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <rect x="10" y="8" width="134" height="16" rx="4" fill="rgba(37, 99, 235, 0.2)" stroke="#2563EB" stroke-width="0.8" />
      <text x="77" y="20" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" text-anchor="middle">50128-K41A-N000-H1-R</text>
      <!-- Process Pill -->
      <rect x="274" y="8" width="46" height="16" rx="4" fill="#111827" stroke="#334155" stroke-width="0.8" />
      <text x="297" y="20" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Blank</text>
      <text x="10" y="39" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Stay R Grabrail</text>
    </g>

    <!-- 4 Metrics Grid -->
    <g transform="translate(14, 94)">
      <rect x="0" y="0" width="76" height="38" rx="8" fill="#1E293B" />
      <text x="38" y="14" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Target</text>
      <text x="38" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">500 pcs</text>

      <rect x="84" y="0" width="76" height="38" rx="8" fill="#1E293B" />
      <text x="122" y="14" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Gross</text>
      <text x="122" y="28" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">499 pcs</text>

      <rect x="168" y="0" width="76" height="38" rx="8" fill="#1E293B" />
      <text x="206" y="14" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Cacat (NG)</text>
      <text x="206" y="28" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">-40 pcs</text>

      <rect x="252" y="0" width="78" height="38" rx="8" fill="#1E293B" />
      <text x="291" y="14" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Net OK</text>
      <text x="291" y="28" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">459 pcs</text>
    </g>

    <!-- Progress & Yield -->
    <g transform="translate(14, 140)">
      <rect x="0" y="0" width="130" height="5" rx="2.5" fill="#334155" />
      <rect x="0" y="0" width="118" height="5" rx="2.5" fill="#EF4444" />
      <text x="0" y="18" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">91.8% Efisiensi</text>

      <rect x="200" y="4" width="130" height="18" rx="5" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="0.8" />
      <text x="265" y="16.5" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">⚠ Below Target (-41 pcs)</text>
    </g>

    <!-- Meta Footer -->
    <line x1="14" y1="168" x2="344" y2="168" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="184" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600">Jumat, 23 Oktober 2026</text>
    <text x="170" y="184" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700">Shift 1</text>
    <text x="240" y="184" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600">Operator: <tspan fill="#F8FAFC" font-weight="700">fauziiifau</tspan></text>
  </g>

  <!-- Production History Card 2 (Sneak Peek) -->
  <g id="ProductionCard_2" transform="translate(16, 546)">
    <rect x="0" y="0" width="358" height="194" rx="16" fill="#111827" stroke="#334155" stroke-width="1" filter="url(#shadow-card)" />
    <text x="16" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">Amada 3</text>
    <rect x="88" y="12" width="60" height="16" rx="4" fill="rgba(37, 99, 235, 0.15)" />
    <text x="118" y="23" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Stamping</text>
    <rect x="294" y="12" width="50" height="16" rx="4" fill="rgba(16, 185, 129, 0.15)" />
    <text x="319" y="23" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">✓ Cloud</text>
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="330" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="20" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">JK047793-1310</text>
      <text x="10" y="38" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Bracket Condensor B (Upper) 1310</text>
    </g>
  </g>

  
    <g id="BottomTabBar">
      <!-- Background Glass Bar -->
      <rect x="0" y="756" width="390" height="88" fill="#0B0F19" stroke="#1E293B" stroke-width="1" filter="url(#shadow-nav)" />
      
      <g id="Tab_Dashboard">
        
        <rect x="35" y="773" width="6" height="6" rx="1.5" fill="#64748B" />
                 <rect x="43" y="773" width="6" height="6" rx="1.5" fill="#64748B" />
                 <rect x="35" y="781" width="6" height="6" rx="1.5" fill="#64748B" />
