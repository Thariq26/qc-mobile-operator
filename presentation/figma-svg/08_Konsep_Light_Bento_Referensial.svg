<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <!-- Background Soft Off-White Gradient -->
    <linearGradient id="canvas-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Hatch Pattern for Target/Ceiling Bars -->
    <pattern id="diagonal-stripe" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#E2E8F0" stroke-width="2.5" />
    </pattern>

    <!-- Lime Active Bar Gradient -->
    <linearGradient id="lime-active-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3E635" />
      <stop offset="100%" stop-color="#65A30D" />
    </linearGradient>

    <!-- Lime Subtle Bar Gradient -->
    <linearGradient id="lime-subtle-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9F99D" />
      <stop offset="100%" stop-color="#BEF264" />
    </linearGradient>

    <!-- Card Soft Shadow Filter -->
    <filter id="soft-card-shadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.03" />
    </filter>

    <!-- Button Circular Shadow -->
    <filter id="btn-circle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="390" height="844" fill="url(#canvas-bg)" />

  <!-- STATUS BAR (iPhone 14/15 Pro) -->
  <g id="StatusBar">
    <text x="34" y="34" fill="#0F172A" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700">9:41</text>
    <!-- Dynamic Island -->
    <rect x="145" y="11" width="100" height="24" rx="12" fill="#000000" />
    <circle cx="228" cy="23" r="5" fill="#1E293B" />
    <circle cx="162" cy="23" r="4" fill="#0A0F1D" />
    <!-- Icons Right: Signal, Wifi, Battery -->
    <g transform="translate(322, 22)" fill="#0F172A">
      <!-- Signal -->
      <rect x="0" y="7" width="2.5" height="4" rx="0.5" />
      <rect x="4" y="5" width="2.5" height="6" rx="0.5" />
      <rect x="8" y="3" width="2.5" height="8" rx="0.5" />
      <rect x="12" y="0" width="2.5" height="11" rx="0.5" />
      <!-- Wifi -->
      <path d="M 20 8 A 4 4 0 0 1 24 8 M 18.5 5.5 A 7 7 0 0 1 25.5 5.5 M 17 3 A 10 10 0 0 1 27 3" fill="none" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" />
      <!-- Battery -->
      <rect x="30" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.2" />
      <rect x="32" y="3" width="14" height="6" rx="1.5" fill="#10B981" />
      <path d="M 51 4 Q 52 4 52 5 L 52 7 Q 52 8 51 8 Z" fill="#0F172A" />
    </g>
  </g>

  <!-- TOP APP BAR -->
  <g id="TopAppBar" transform="translate(16, 52)">
    <!-- Back Circle Button -->
    <circle cx="20" cy="20" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#btn-circle-shadow)" />
    <path d="M 23 14 L 17 20 L 23 26" fill="none" stroke="#0F172A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Title -->
    <text x="179" y="26" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" text-anchor="middle">Statistik Kualitas</text>

    <!-- More Circle Button (...) -->
    <circle cx="338" cy="20" r="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#btn-circle-shadow)" />
    <circle cx="331" cy="20" r="2" fill="#0F172A" />
    <circle cx="338" cy="20" r="2" fill="#0F172A" />
    <circle cx="345" cy="20" r="2" fill="#0F172A" />
  </g>

  <!-- MAIN HERO CARD: DEFECT RATE & WEEKLY HATCHED BAR CHART -->
  <g id="MainHeroCard" transform="translate(16, 108)">
    <!-- Card Surface -->
    <rect x="0" y="0" width="358" height="344" rx="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-card-shadow)" />

    <!-- Card Header Info -->
    <g transform="translate(24, 28)">
      <text x="0" y="0" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Defect Rate Harian</text>
      
      <!-- Big Hero Number -->
      <text x="0" y="38" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">1.22%</text>
      <text x="108" y="38" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600">rata-rata</text>

      <!-- Target Info on the Right -->
      <text x="310" y="34" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="600" text-anchor="end">
        Target: <tspan fill="#0F172A" font-weight="800">&lt; 2.00%</tspan>
      </text>

      <!-- Subtitle badge pill -->
      <rect x="0" y="48" width="92" height="18" rx="5" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8" />
      <text x="46" y="61" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">IN-CONTROL</text>
    </g>

    <!-- BAR CHART CONTAINER -->
    <g id="WeeklyBarChart" transform="translate(24, 116)">
      <!-- Baseline Divider -->
      <line x1="0" y1="172" x2="310" y2="172" stroke="#E2E8F0" stroke-width="1" />

      <!-- DAY 1: MON (Senin) -->
      <g id="Col_Mon" transform="translate(6, 0)">
        <!-- Hatched Background Bar (Target Limit) -->
        <rect x="0" y="48" width="18" height="124" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <!-- Actual Foreground Pill Bar -->
        <rect x="0" y="86" width="18" height="86" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="78" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">0.8%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Sen</text>
      </g>

      <!-- DAY 2: TUE (Selasa) -->
      <g id="Col_Tue" transform="translate(50, 0)">
        <rect x="0" y="32" width="18" height="140" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <rect x="0" y="68" width="18" height="104" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="60" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">1.1%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Sel</text>
      </g>

      <!-- DAY 3: WED (Rabu) -->
      <g id="Col_Wed" transform="translate(94, 0)">
        <rect x="0" y="58" width="18" height="114" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <rect x="0" y="102" width="18" height="70" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="94" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">0.7%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Rab</text>
      </g>

      <!-- DAY 4: THU (Kamis) - ACTIVE / HIGHLIGHT PEAK DAY -->
      <g id="Col_Thu" transform="translate(138, 0)">
        <!-- Highlighted Background Glow -->
        <rect x="-4" y="6" width="26" height="170" rx="13" fill="#F7FEE7" />
        <!-- Hatched Background Bar -->
        <rect x="0" y="20" width="18" height="152" rx="9" fill="url(#diagonal-stripe)" stroke="#D9F99D" stroke-width="1" />
        <!-- Solid Bright Lime Peak Bar -->
        <rect x="0" y="24" width="18" height="148" rx="9" fill="url(#lime-active-grad)" />
        
        <!-- Peak Percentage Badge Pill -->
        <rect x="-7" y="2" width="32" height="18" rx="6" fill="#111827" />
        <text x="9" y="14" fill="#BEF264" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">1.8%</text>

        <!-- Active Day Pill Label -->
        <rect x="-4" y="180" width="26" height="18" rx="6" fill="#0F172A" />
        <text x="9" y="193" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Kam</text>
      </g>

      <!-- DAY 5: FRI (Jumat) -->
      <g id="Col_Fri" transform="translate(182, 0)">
        <rect x="0" y="38" width="18" height="134" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <rect x="0" y="62" width="18" height="110" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="54" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">1.2%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Jum</text>
      </g>

      <!-- DAY 6: SAT (Sabtu) -->
      <g id="Col_Sat" transform="translate(226, 0)">
        <rect x="0" y="28" width="18" height="144" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <rect x="0" y="44" width="18" height="128" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="36" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">1.4%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Sab</text>
      </g>

      <!-- DAY 7: SUN (Minggu) -->
      <g id="Col_Sun" transform="translate(270, 0)">
        <rect x="0" y="52" width="18" height="120" rx="9" fill="url(#diagonal-stripe)" stroke="#E2E8F0" stroke-width="1" />
        <rect x="0" y="112" width="18" height="60" rx="9" fill="url(#lime-subtle-grad)" />
        <text x="9" y="104" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" text-anchor="middle">0.6%</text>
        <text x="9" y="192" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Min</text>
      </g>
    </g>
  </g>

  <!-- 2x2 BENTO METRIC CARDS -->
  <g id="BentoGrid" transform="translate(16, 468)">

    <!-- CARD 1 (TOP-LEFT): TOTAL PRODUKSI -->
    <g id="Card_TotalProduksi">
      <rect x="0" y="0" width="173" height="152" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-card-shadow)" />
      
      <!-- Icon + Category Row -->
      <g transform="translate(16, 16)">
        <circle cx="15" cy="15" r="15" fill="#ECFDF5" />
        <!-- Factory / Gear Icon -->
        <path d="M 8 20 L 8 13 L 13 16 L 13 13 L 18 16 L 18 11 L 22 13 L 22 20 Z" fill="#10B981" />
        <text x="38" y="20" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Produksi</text>
      </g>

      <!-- Sparkline Activity Bars -->
      <g transform="translate(16, 56)">
        <rect x="0" y="16" width="4" height="14" rx="2" fill="#10B981" />
        <rect x="10" y="20" width="4" height="10" rx="2" fill="#10B981" opacity="0.6" />
        <rect x="20" y="10" width="4" height="20" rx="2" fill="#10B981" />
        <rect x="30" y="4" width="4" height="26" rx="2" fill="#10B981" />
        <rect x="40" y="12" width="4" height="18" rx="2" fill="#10B981" />
        <rect x="50" y="8" width="4" height="22" rx="2" fill="#10B981" />
        <rect x="60" y="14" width="4" height="16" rx="2" fill="#10B981" />
        <rect x="70" y="6" width="4" height="24" rx="2" fill="#10B981" />
        <rect x="80" y="12" width="4" height="18" rx="2" fill="#10B981" />
        <rect x="90" y="18" width="4" height="12" rx="2" fill="#10B981" opacity="0.6" />
        <rect x="100" y="14" width="4" height="16" rx="2" fill="#10B981" />
        <rect x="110" y="22" width="4" height="8" rx="2" fill="#10B981" opacity="0.4" />
      </g>

      <!-- Value & Subtitle -->
      <g transform="translate(16, 126)">
        <text x="0" y="0" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">112.022</text>
        <text x="82" y="0" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">pcs</text>
        <text x="0" y="14" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">● On Target (+4.2%)</text>
      </g>
    </g>

    <!-- CARD 2 (TOP-RIGHT): TOTAL NG CACAT -->
    <g id="Card_TotalNg" transform="translate(185, 0)">
      <rect x="0" y="0" width="173" height="152" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-card-shadow)" />
      
      <!-- Icon + Category Row -->
      <g transform="translate(16, 16)">
        <circle cx="15" cy="15" r="15" fill="#FEF2F2" />
        <!-- Heart / Pulse Alert Icon -->
        <path d="M 15 10 C 13 8 9 9 9 13 C 9 17 15 21 15 21 C 15 21 21 17 21 13 C 21 9 17 8 15 10 Z" fill="#EF4444" />
        <text x="38" y="20" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Total NG</text>
      </g>

      <!-- Sparkline Pulse Waveform -->
      <g transform="translate(16, 72)">
        <path d="M 0 10 L 25 10 L 32 3 L 40 18 L 48 0 L 56 16 L 62 10 L 85 10 L 92 4 L 98 14 L 105 10 L 138 10" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </g>

      <!-- Value & Subtitle -->
      <g transform="translate(16, 126)">
        <text x="0" y="0" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">1.364</text>
        <text x="58" y="0" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">pcs</text>
        <text x="0" y="14" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">● 1.22% Lini Terkendali</text>
      </g>
    </g>

    <!-- CARD 3 (BOTTOM-LEFT): EFISIENSI YIELD -->
    <g id="Card_EfisiensiYield" transform="translate(0, 164)">
      <rect x="0" y="0" width="173" height="88" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-card-shadow)" />
      
      <!-- Icon + Category Row -->
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#FFFBEB" />
        <!-- Gauge Icon -->
        <circle cx="14" cy="14" r="7" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="14 8" />
        <path d="M 14 14 L 18 10" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" />
        <text x="36" y="18" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Yield Mutu</text>
      </g>

      <!-- Value -->
      <g transform="translate(16, 68)">
        <text x="0" y="0" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">98.78%</text>
        <text x="86" y="0" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Net OK</text>
      </g>
    </g>

    <!-- CARD 4 (BOTTOM-RIGHT): KOMPLAIN CUSTOMER -->
    <g id="Card_KomplainCustomer" transform="translate(185, 164)">
      <rect x="0" y="0" width="173" height="88" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#soft-card-shadow)" />
      
      <!-- Icon + Category Row -->
      <g transform="translate(16, 14)">
        <circle cx="14" cy="14" r="14" fill="#F0F9FF" />
        <!-- Shield / Check Icon -->
        <path d="M 14 7 L 8 9.5 L 8 14 C 8 18 14 21 14 21 C 14 21 20 18 20 14 L 20 9.5 Z" fill="#0284C7" />
        <path d="M 11 14 L 13 16 L 17 12" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
        <text x="36" y="18" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Komplain</text>
      </g>

      <!-- Value -->
      <g transform="translate(16, 68)">
        <text x="0" y="0" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">0</text>
        <text x="18" y="0" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">kasus</text>
        <text x="68" y="0" fill="#0284C7" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">Zero Claim</text>
      </g>
    </g>
  </g>

  <!-- iOS BOTTOM HOME BAR -->
  <rect x="125" y="828" width="140" height="5" rx="2.5" fill="#0F172A" />

</svg>
