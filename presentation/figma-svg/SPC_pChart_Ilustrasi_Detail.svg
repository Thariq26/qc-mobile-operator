<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 720" width="840" height="720">
  
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg-canvas-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-surface-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Chart Grid Background -->
    <linearGradient id="chart-grid-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#04070D" />
    </linearGradient>

    <!-- Chart Area Under Curve Gradient -->
    <linearGradient id="spc-curve-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(59, 130, 246, 0.42)" />
      <stop offset="60%" stop-color="rgba(59, 130, 246, 0.12)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.0)" />
    </linearGradient>

    <!-- Line Stroke Gradient -->
    <linearGradient id="spc-line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- AI Banner Gradient -->
    <linearGradient id="ai-banner-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.22)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.18)" />
    </linearGradient>

    <!-- AI Button Gradient -->
    <linearGradient id="ai-btn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="card-shadow" x="-8%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Point Glow Filter -->
    <filter id="point-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="840" height="720" fill="url(#bg-canvas-grad)" />

  <!-- MAIN SPC CARD CONTAINER -->
  <g id="SpcMainCard" transform="translate(30, 28)">
    
    <!-- Outer Card Surface -->
    <rect x="0" y="0" width="780" height="664" rx="28" fill="url(#card-surface-grad)" stroke="#1E293B" stroke-width="1.4" filter="url(#card-shadow)" />

    <!-- 1. CARD HEADER -->
    <g id="HeaderSection" transform="translate(32, 28)">
      <!-- Title & Icon -->
      <g transform="translate(0, 0)">
        <!-- Chart Activity Icon -->
        <rect x="0" y="0" width="36" height="36" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.35)" stroke-width="1" />
        <path d="M 10 24 L 14 18 L 19 22 L 26 12" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="26" cy="12" r="2" fill="#38BDF8" />

        <text x="48" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="0.3">SPC CONTROL CHART (p-CHART)</text>
        <text x="48" y="44" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="500">Proporsi Semua Cacat &amp; Batas Kendali 3-Sigma ISO 9001:2015 • PT Galaxy Mandiri Perkasa</text>
      </g>

      <!-- Status Badge Pill: IN-CONTROL (Top Right) -->
      <g transform="translate(584, 4)">
        <rect x="0" y="0" width="132" height="32" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1.2" />
        <!-- Pulsing Green Dot -->
        <circle cx="18" cy="16" r="4.5" fill="#10B981" />
        <circle cx="18" cy="16" r="8" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.5" />
        <text x="74" y="21" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="0.6" text-anchor="middle">IN-CONTROL</text>
      </g>
    </g>

    <!-- 2. 3-SIGMA STATISTICAL LIMITS BENTO BAR -->
    <g id="LimitsBentoBar" transform="translate(32, 92)">
      <rect x="0" y="0" width="716" height="44" rx="12" fill="#0B101D" stroke="#1E293B" stroke-width="1" />

      <!-- Limit 1: UCL -->
      <g transform="translate(24, 13)">
        <circle cx="8" cy="9" r="5" fill="#EF4444" />
        <text x="22" y="13" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">UCL : 2.45%</text>
        <text x="120" y="13" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600">(Batas Kendali Atas +3σ)</text>
      </g>

      <line x1="286" y1="10" x2="286" y2="34" stroke="#1E293B" stroke-width="1" />

      <!-- Limit 2: CL -->
      <g transform="translate(304, 13)">
        <circle cx="8" cy="9" r="5" fill="#3B82F6" />
        <text x="22" y="13" fill="#60A5FA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">CL (p̄) : 1.22%</text>
        <text x="126" y="13" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600">(Garis Tengah / Rata-rata)</text>
      </g>

      <line x1="538" y1="10" x2="538" y2="34" stroke="#1E293B" stroke-width="1" />

      <!-- Limit 3: LCL -->
      <g transform="translate(556, 13)">
        <circle cx="8" cy="9" r="5" fill="#10B981" />
        <text x="22" y="13" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">LCL : 0.00%</text>
        <text x="116" y="13" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600">(Batas Bawah)</text>
      </g>
    </g>

    <!-- 3. MAIN GRAPHIC COORDINATE PLOT (SPC CHART CANVAS) -->
    <g id="ChartPlotArea" transform="translate(32, 150)">
      
      <!-- Chart Canvas Background -->
      <rect x="0" y="0" width="716" height="286" rx="16" fill="url(#chart-grid-grad)" stroke="#1E293B" stroke-width="1.2" />

      <!-- Grid Coordinates & Scales -->
      <!-- Plot Boundaries: X from 64 to 680 (width: 616px), Y from 36 to 244 (height: 208px) -->
      <!-- Y-scale: 2.5% = y:38, 2.0% = y:79, 1.5% = y:120, 1.22% = y:143, 1.0% = y:161, 0.5% = y:202, 0.0% = y:244 -->

      <!-- Light Horizontal Grid Lines -->
      <line x1="58" y1="79" x2="690" y2="79" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
      <text x="46" y="83" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="end">2.0%</text>

      <line x1="58" y1="120" x2="690" y2="120" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
      <text x="46" y="124" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="end">1.5%</text>

      <line x1="58" y1="161" x2="690" y2="161" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
      <text x="46" y="165" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="end">1.0%</text>

      <line x1="58" y1="202" x2="690" y2="202" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6" />
      <text x="46" y="206" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" text-anchor="end">0.5%</text>

      <!-- STATISTICAL LIMIT LINES -->

      <!-- 1. UCL Line (Dashed Red at 2.45% -> y: 42) -->
      <line x1="58" y1="42" x2="690" y2="42" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.9" />
      <rect x="626" y="30" width="64" height="20" rx="5" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="0.8" />
      <text x="658" y="44" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">UCL 2.45%</text>
      <text x="46" y="46" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="end">2.45%</text>

      <!-- 2. CL Line (Solid Steel Blue at 1.22% -> y: 143) -->
      <line x1="58" y1="143" x2="690" y2="143" stroke="#3B82F6" stroke-width="2.2" opacity="0.95" />
      <rect x="628" y="132" width="62" height="20" rx="5" fill="rgba(59, 130, 246, 0.2)" stroke="#3B82F6" stroke-width="0.8" />
      <text x="659" y="146" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">CL 1.22%</text>
      <text x="46" y="147" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="end">1.22%</text>

      <!-- 3. LCL Line (Dashed Green at 0.00% -> y: 244) -->
      <line x1="58" y1="244" x2="690" y2="244" stroke="#10B981" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.9" />
      <rect x="628" y="234" width="62" height="20" rx="5" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="0.8" />
      <text x="659" y="247" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="800" text-anchor="middle">LCL 0.00%</text>
      <text x="46" y="248" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="end">0.00%</text>

      <!-- X-AXIS POINTS COORDINATES (7 Subgroups):
           Point 1: x: 90,  y: 172 (24/10 -> 0.88%)
           Point 2: x: 176, y: 152 (25/10 -> 1.11%)
           Point 3: x: 262, y: 180 (26/10 -> 0.78%)
           Point 4: x: 348, y: 91  (27/10 -> 1.85% Peak)
           Point 5: x: 434, y: 143 (28/10 -> 1.22%)
           Point 6: x: 520, y: 126 (29/10 -> 1.42%)
           Point 7: x: 606, y: 168 (30/10 -> 0.92%)
      -->

      <!-- Translucent Gradient Area Under Curve -->
      <path d="M 90 244 L 90 172 C 130 162, 140 152, 176 152 C 215 152, 230 180, 262 180 C 295 180, 315 91, 348 91 C 385 91, 405 143, 434 143 C 470 143, 490 126, 520 126 C 555 126, 575 168, 606 168 L 606 244 Z" fill="url(#spc-curve-area)" />

      <!-- Smooth Continuous Trend Curve -->
      <path d="M 90 172 C 130 162, 140 152, 176 152 C 215 152, 230 180, 262 180 C 295 180, 315 91, 348 91 C 385 91, 405 143, 434 143 C 470 143, 490 126, 520 126 C 555 126, 575 168, 606 168" fill="none" stroke="url(#spc-line-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Point 1 (24/10) -->
      <circle cx="90" cy="172" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="90" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">24/10</text>
      <text x="90" y="160" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">0.88%</text>

      <!-- Point 2 (25/10) -->
      <circle cx="176" cy="152" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="176" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">25/10</text>
      <text x="176" y="140" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">1.11%</text>

      <!-- Point 3 (26/10) -->
      <circle cx="262" cy="180" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="262" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">26/10</text>
      <text x="262" y="198" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">0.78%</text>

      <!-- Point 4 (27/10) - HIGHLIGHT PEAK ANOMALY -->
      <g id="PeakPointHighlight">
        <!-- Glow Circle -->
        <circle cx="348" cy="91" r="11" fill="rgba(56, 189, 248, 0.3)" />
        <circle cx="348" cy="91" r="6.5" fill="#0284C7" stroke="#38BDF8" stroke-width="3" filter="url(#point-glow)" />
        <circle cx="348" cy="91" r="3" fill="#FFFFFF" />

        <!-- Vertical Guideline to Axis -->
        <line x1="348" y1="102" x2="348" y2="244" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7" />

        <!-- Floating Tooltip Callout Badge -->
        <g transform="translate(258, 26)">
          <rect x="0" y="0" width="180" height="38" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" filter="url(#card-shadow)" />
          <path d="M 90 38 L 90 44" stroke="#38BDF8" stroke-width="1.5" />
          <circle cx="16" cy="19" r="4" fill="#38BDF8" />
          <text x="28" y="18" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">27/10: 1.85% (Peak)</text>
          <text x="28" y="30" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">Dalam Batas Kendali ISO</text>
        </g>

        <!-- Highlighted X-Axis Label -->
        <rect x="326" y="254" width="44" height="20" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
        <text x="348" y="268" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle">27/10</text>
      </g>

      <!-- Point 5 (28/10) -->
      <circle cx="434" cy="143" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="434" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">28/10</text>
      <text x="434" y="131" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">1.22%</text>

      <!-- Point 6 (29/10) -->
      <circle cx="520" cy="126" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="520" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">29/10</text>
      <text x="520" y="114" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">1.42%</text>

      <!-- Point 7 (30/10) -->
      <circle cx="606" cy="168" r="5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.2" />
      <text x="606" y="266" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">30/10</text>
      <text x="606" y="156" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">0.92%</text>
    </g>

    <!-- 4. STRATIFIKASI CACAT UTAMA (TOP 5 PARETO PILLS) -->
    <g id="StratifikasiSection" transform="translate(32, 456)">
      <text x="0" y="16" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">STRATIFIKASI CACAT UTAMA (PARETO 80/20 DRILLDOWN):</text>

      <!-- Pill 1: ALL (Active) -->
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="138" height="34" rx="10" fill="#2563EB" stroke="#3B82F6" stroke-width="1.2" />
        <path d="M 16 17 L 20 21 L 28 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="36" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">ALL (1.364 pcs)</text>
      </g>

      <!-- Pill 2: Burry (Rank #1) -->
      <g transform="translate(148, 28)">
        <rect x="0" y="0" width="132" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#EF4444" />
        <text x="28" y="22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Burry (342 pcs)</text>
      </g>

      <!-- Pill 3: Dent (Rank #2) -->
      <g transform="translate(290, 28)">
        <rect x="0" y="0" width="128" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#F59E0B" />
        <text x="28" y="22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Dent (285 pcs)</text>
      </g>

      <!-- Pill 4: Scratch (Rank #3) -->
      <g transform="translate(428, 28)">
        <rect x="0" y="0" width="138" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#0EA5E9" />
        <text x="28" y="22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Scratch (210 pcs)</text>
      </g>

      <!-- Pill 5: Crack (Rank #4) -->
      <g transform="translate(576, 28)">
        <rect x="0" y="0" width="140" height="34" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="17" r="4" fill="#8B5CF6" />
        <text x="28" y="22" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Crack (178 pcs)</text>
      </g>
    </g>

    <!-- 5. AI RANDOM FOREST MITIGATION BANNER (FOOTER) -->
    <g id="AiRecommendationBanner" transform="translate(32, 542)">
      <rect x="0" y="0" width="716" height="82" rx="16" fill="url(#ai-banner-grad)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />

      <!-- Sparkle / Brain Icon -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="42" height="42" rx="12" fill="rgba(168, 85, 247, 0.25)" />
        <path d="M 21 11 L 23 17 L 29 19 L 23 21 L 21 27 L 19 21 L 13 19 L 19 17 Z" fill="#C084FC" />
        <circle cx="30" cy="13" r="2" fill="#A855F7" />
      </g>

      <!-- Text Recommendation -->
      <g transform="translate(74, 22)">
        <text x="0" y="14" fill="#E2E8F0" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">REKOMENDASI SOLUSI AI (RANDOM FOREST v2):</text>
        <text x="0" y="34" fill="#C4B5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">Penyebab utama <tspan fill="#FCA5A5" font-weight="700">Burry</tspan> terdeteksi pada proses <tspan fill="#FFFFFF" font-weight="700">Blanking</tspan> mesin <tspan fill="#FFFFFF" font-weight="700">Amada Press 01</tspan>. Rekomendasi: Asah ulang die punch &amp; cek clearance pisau potong.</text>
      </g>

      <!-- Action Button -->
      <g transform="translate(564, 22)">
        <rect x="0" y="0" width="134" height="38" rx="10" fill="url(#ai-btn-grad)" />
        <text x="67" y="23" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Lihat Tindakan Solusi →</text>
      </g>
    </g>

  </g>
</svg>
