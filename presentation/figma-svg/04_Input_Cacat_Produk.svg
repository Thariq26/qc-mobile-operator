<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <linearGradient id="primary-btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="critical-btn-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <linearGradient id="chart-area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0.35)" />
      <stop offset="100%" stop-color="rgba(37, 99, 235, 0.0)" />
    </linearGradient>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="shadow-nav" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg-grad)" />
  
    <g id="StatusBar" opacity="0.9">
      <text x="32" y="34" fill="#F8FAFC" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="700">09:41</text>
      <!-- Dynamic Island / Speaker -->
      <rect x="145" y="11" width="100" height="24" rx="12" fill="#000000" stroke="#1E293B" stroke-width="0.5" />
      <circle x="228" y="23" r="5" fill="#0F172A" />
      <circle x="162" y="23" r="4" fill="#0A0F1D" />
      <!-- Icons Right: Signal, Wifi, Battery -->
      <g transform="translate(322, 22)" fill="#F8FAFC">
        <!-- Signal -->
        <rect x="0" y="7" width="2.5" height="4" rx="0.5" />
        <rect x="4" y="5" width="2.5" height="6" rx="0.5" />
        <rect x="8" y="3" width="2.5" height="8" rx="0.5" />
        <rect x="12" y="0" width="2.5" height="11" rx="0.5" />
        <!-- Wifi -->
        <path d="M 20 8 A 4 4 0 0 1 24 8 M 18.5 5.5 A 7 7 0 0 1 25.5 5.5 M 17 3 A 10 10 0 0 1 27 3" fill="none" stroke="#F8FAFC" stroke-width="1.3" stroke-linecap="round" />
        <!-- Battery -->
        <rect x="30" y="1" width="20" height="10" rx="2.5" fill="none" stroke="#F8FAFC" stroke-width="1.2" />
        <rect x="32" y="3" width="14" height="6" rx="1.5" fill="#10B981" />
        <path d="M 51 4 Q 52 4 52 5 L 52 7 Q 52 8 51 8 Z" fill="#F8FAFC" />
      </g>
    </g>
  
  
    <g id="AppHeader">
      <!-- Top separator border -->
      <line x1="16" y1="102" x2="374" y2="102" stroke="#1E293B" stroke-width="1" />
      
      <!-- Avatar with initials -->
      <rect x="16" y="54" width="40" height="40" rx="12" fill="#2563EB" />
      <text x="36" y="79" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">AQ</text>
      
      <!-- Company Eyebrow & Username -->
      <text x="64" y="66" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">PT GALAXY MANDIRI PERKASA</text>
      <text x="64" y="84" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">Administrator QC GMP</text>
      
      <!-- Role Badge Pill -->
      <rect x="238" y="72" width="46" height="17" rx="5" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="0.8" />
      <text x="261" y="84" fill="#C084FC" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">Admin</text>
      
      <!-- Online Status Pill -->
      <rect x="296" y="64" width="56" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <circle x="306" y="75" r="3.5" fill="#10B981" />
      <text x="331" y="79" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="0.4">ONLINE</text>
      
      <!-- Theme Moon Toggle Button -->
      <rect x="358" y="62" width="26" height="26" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.8" />
      <path d="M 373 70 A 5 5 0 1 1 367 76 A 4.5 4.5 0 0 0 373 70 Z" fill="#F59E0B" />
    </g>
  

  <!-- Header -->
  <g id="SectionHeader" transform="translate(16, 118)">
    <text x="0" y="10" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="800" letter-spacing="0.4">CATAT CACAT PRODUK (NG)</text>
    <text x="0" y="27" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="500">Formulir inspeksi kualitas real-time lini perakitan PT Galaxy Mandiri</text>
  </g>

  <!-- Period & Date Pills -->
  <g id="DateSelector" transform="translate(16, 154)">
    <!-- Tab 1: Hari Ini -->
    <rect x="0" y="0" width="114" height="34" rx="8" fill="#2563EB" />
    <text x="57" y="21" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Hari Ini</text>
    <!-- Tab 2: Kemarin -->
    <rect x="122" y="0" width="114" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="179" y="21" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kemarin</text>
    <!-- Tab 3: Pilih Tanggal -->
    <rect x="244" y="0" width="114" height="34" rx="8" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="301" y="21" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pilih Tanggal</text>
  </g>

  <!-- Shift Selection -->
  <g id="ShiftSelector" transform="translate(16, 198)">
    <text x="0" y="0" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.4">PILIH SHIFT KERJA OPERASIONAL *</text>
    <rect x="0" y="8" width="174" height="38" rx="10" fill="#2563EB" />
    <text x="87" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Shift 1</text>
    <rect x="184" y="8" width="174" height="38" rx="10" fill="#111827" stroke="#334155" stroke-width="1" />
    <text x="271" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shift 2</text>
  </g>

  <!-- Inspector Form Card -->
  <g id="DefectInputCard" transform="translate(16, 258)">
    <rect x="0" y="0" width="358" height="480" rx="18" fill="#111827" stroke="#334155" stroke-width="1.2" filter="url(#shadow-card)" />

    <!-- 1. Operator Lini Produksi Dropdown -->
    <text x="16" y="24" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">OPERATOR LINI PRODUKSI * (TRACEABILITY ISO)</text>
    <rect x="16" y="32" width="326" height="46" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="26" y="41" width="28" height="28" rx="8" fill="#2563EB" />
    <text x="40" y="59" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">AF</text>
    <text x="64" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Aliva Fauzi Octavian</text>
    <text x="64" y="66" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500">@fauziiifau • Operator Lini Stamping</text>
    <path d="M 326 55 L 330 60 L 334 55" fill="none" stroke="#94A3B8" stroke-width="1.8" />

    <!-- 2. Part Number Dropdown -->
    <text x="16" y="96" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">PART NUMBER / NAMA PART * (110 PART TERDAFTAR)</text>
    <rect x="16" y="104" width="326" height="50" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <rect x="28" y="112" width="136" height="17" rx="5" fill="#2563EB" />
    <text x="96" y="124" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">50128-K41A-N000-H1-R</text>
    <text x="28" y="144" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700">Stay R Grabrail <tspan fill="#64748B" font-size="10">• Lini: Welding</tspan></text>
    <path d="M 326 128 L 330 133 L 334 128" fill="none" stroke="#94A3B8" stroke-width="1.8" />

    <!-- 3. Jenis Cacat (Defect Type) Dropdown -->
    <text x="16" y="172" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">JENIS CACAT (DEFECT TYPE) * (21 JENIS)</text>
    <rect x="16" y="180" width="326" height="50" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="28" y="200" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">Burry</text>
    <!-- Major Defect Badge -->
    <rect x="74" y="188" width="76" height="16" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="0.8" />
    <text x="112" y="200" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" text-anchor="middle">Major Defect</text>
    <text x="28" y="220" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500">Proses Standar: Stamping • Kategori Dimensi &amp; Visual</text>
    <path d="M 326 204 L 330 209 L 334 204" fill="none" stroke="#94A3B8" stroke-width="1.8" />

    <!-- 4. Jumlah Cacat NG Stepper Input -->
    <text x="16" y="248" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">JUMLAH TEMUAN CACAT (PCS) *</text>
    <g transform="translate(16, 256)">
      <rect x="0" y="0" width="46" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="23" y="26" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">-</text>

      <rect x="54" y="0" width="218" height="42" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.2" />
      <text x="163" y="28" fill="#EF4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="middle">71 pcs NG</text>

      <rect x="280" y="0" width="46" height="42" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="303" y="26" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">+</text>
    </g>

    <!-- 5. Bukti Foto Kamera Upload -->
    <text x="16" y="318" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800">BUKTI FOTO INSPEKSI MUTU (CAMERA UPLOAD)</text>
    <rect x="16" y="326" width="326" height="74" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" stroke-dasharray="4 3" />
    <circle cx="56" cy="363" r="18" fill="#2563EB" opacity="0.15" />
    <path d="M 48 360 L 52 355 L 60 355 L 64 360 L 67 360 Q 69 360 69 362 L 69 371 Q 69 373 67 373 L 45 373 Q 43 373 43 371 L 43 362 Q 43 360 45 360 Z" fill="none" stroke="#3B82F6" stroke-width="1.6" />
    <circle cx="56" cy="366" r="3.5" fill="none" stroke="#3B82F6" stroke-width="1.4" />
    <text x="86" y="358" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Ambil Foto / Unggah Bukti Cacat</text>
    <text x="86" y="374" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="500">Mendukung kamera HP &amp; galeri visual inspektur</text>

    <!-- Catat Defect Submit Button -->
    <rect x="16" y="416" width="326" height="46" rx="12" fill="url(#critical-btn-grad)" filter="url(#shadow-card)" />
    <text x="179" y="445" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0.3">Simpan Temuan Cacat (NG)</text>
  </g>

  
    <g id="BottomTabBar">
      <!-- Background Glass Bar -->
      <rect x="0" y="756" width="390" height="88" fill="#0B0F19" stroke="#1E293B" stroke-width="1" filter="url(#shadow-nav)" />
      
      <g id="Tab_Dashboard">
        
        <rect x="35" y="773" width="6" height="6" rx="1.5" fill="#64748B" />
                 <rect x="43" y="773" width="6" height="6" rx="1.5" fill="#64748B" />
                 <rect x="35" y="781" width="6" height="6" rx="1.5" fill="#64748B" />
                 <rect x="43" y="781" width="6" height="6" rx="1.5" fill="#64748B" />
        <text x="42" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Dashboard</text>
      </g>
    
      <g id="Tab_InputProduction">
        
        <path d="M 111 787 L 111 777 L 116 780 L 116 777 L 121 780 L 121 774 L 125 774 L 125 787 Z" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linejoin="round" />
        <text x="118" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Input Prod</text>
      </g>
    
      <g id="Tab_InputDefect">
        <rect x="177" y="768" width="36" height="24" rx="12" fill="rgba(37, 99, 235, 0.2)" stroke="rgba(37, 99, 235, 0.4)" stroke-width="0.8" />
         <line x1="187" y1="809" x2="203" y2="809" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="195" cy="780" r="8" fill="none" stroke="#2563EB" stroke-width="1.6" />
                 <line x1="195" y1="776" x2="195" y2="784" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" />
                 <line x1="191" y1="780" x2="199" y2="780" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" />
        <text x="195" y="804" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">Catat NG</text>
      </g>
    
      <g id="Tab_History">
        
        <rect x="266" y="774" width="12" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="1.6" />
                 <path d="M 269 774 L 269 772 Q 269 771 270 771 L 274 771 Q 275 771 275 772 L 275 774 Z" fill="#64748B" />
                 <path d="M 269 782 L 271 784 L 275 778" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="272" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Riwayat</text>
      </g>
    
      <g id="Tab_Complaints">
        
        <rect x="341" y="773" width="14" height="15" rx="2" fill="none" stroke="#64748B" stroke-width="1.6" />
                 <line x1="345" y1="777" x2="345" y2="779" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="351" y1="777" x2="351" y2="779" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="345" y1="781" x2="345" y2="783" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="351" y1="781" x2="351" y2="783" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" />
        <text x="348" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Komplain</text>
      </g>
    
    </g>
  
</svg>