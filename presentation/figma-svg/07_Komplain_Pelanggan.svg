                 <path d="M 269 782 L 271 784 L 275 778" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
        <text x="272" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Riwayat</text>
      </g>
    
      <g id="Tab_Complaints">
        <rect x="330" y="768" width="36" height="24" rx="12" fill="rgba(37, 99, 235, 0.2)" stroke="rgba(37, 99, 235, 0.4)" stroke-width="0.8" />
         <line x1="340" y1="809" x2="356" y2="809" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" />
        <rect x="341" y="773" width="14" height="15" rx="2" fill="none" stroke="#2563EB" stroke-width="1.6" />
                 <line x1="345" y1="777" x2="345" y2="779" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="351" y1="777" x2="351" y2="779" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="345" y1="781" x2="345" y2="783" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
                 <line x1="351" y1="781" x2="351" y2="783" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" />
        <text x="348" y="804" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">Komplain</text>
