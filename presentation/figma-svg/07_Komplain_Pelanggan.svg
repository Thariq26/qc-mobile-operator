      <g id="Tab_InputProduction">
        
        <path d="M 111 787 L 111 777 L 116 780 L 116 777 L 121 780 L 121 774 L 125 774 L 125 787 Z" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linejoin="round" />
        <text x="118" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Input Prod</text>
      </g>
    
      <g id="Tab_InputDefect">
        
        <circle cx="195" cy="780" r="8" fill="none" stroke="#64748B" stroke-width="1.6" />
                 <line x1="195" y1="776" x2="195" y2="784" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" />
                 <line x1="191" y1="780" x2="199" y2="780" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" />
        <text x="195" y="804" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Catat NG</text>
      </g>
    
